[project]
name = "ordnung"
# the package's version is __version__ in src/ordnung/__init__.py ([tool.hatch.version]); a release
# changes the web app's and the demo's copies too (tests/test_regressions_install.py)
dynamic = ["version"]
description = "Your private AI secretary for life admin — reads your letters, bills and contracts, tracks every deadline with verifiable evidence, and reminds you before it matters. Runs locally with your own Claude subscription."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/ordnung/drafts/fonts/LICENSE-DejaVu.txt", "src/ordnung/rules/data/LICENSE-GeoNames.txt"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Hobeishy" }]
keywords = ["ai", "agent", "claude", "personal-assistant", "paperwork", "deadlines", "germany", "local-first", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
]
dependencies = [
  # Floors of what parses untrusted files and requests (Starlette, h11, multipart, PDF, images)
  # exclude releases with known CVEs.
  "fastapi>=0.115",
  "starlette>=1.3.1",
  "h11>=0.16",
  # mcp needs uvicorn 0.31.1 and sse-starlette 3.0: lower floors could never be installed together
  "uvicorn[standard]>=0.31.1",
  "pydantic>=2.8",
  "typer>=0.19",  # older ones can't build the CLI's `Path | None` and `Literal` options
  "rich>=13.7",
  "pdfplumber>=0.11.9",
  "pdfminer.six>=20260107",
  "pypdfium2>=4.30",
  "pillow>=12.3.0",
  "pillow-heif>=1.3.0",
  "holidays>=0.66",  # older ones lose the partial holidays (Fronleichnam in Saxony and Thuringia)
  "python-dateutil>=2.9",
  "icalendar>=6.1",  # the .ics export adds its time zones with add_missing_timezones
  "fpdf2>=2.8.5",  # the demo's photographed letter is recorded by the bytes fpdf2 writes
  "rapidfuzz>=3.9",
  "platformdirs>=4.2",
  "watchfiles>=0.24",
  "sse-starlette>=3.0",
  "python-multipart>=0.0.31",
  "httpx>=0.27",
  "mcp>=2.0",
  # encrypted backups (AES-256-GCM, scrypt, HKDF); already needed by pdfminer.six
  "cryptography>=44.0.1",
  # calendar sync keeps the app password in the OS password store, never in the database
  "keyring>=25",
  # phone access lists the network interfaces with their names and netmasks (pure Python)
  "ifaddr>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
  "hypothesis>=6.100",
  "jsonschema>=4.20",
  # what the tests need beyond the app's own floors: CliRunner's separate stderr, and an MCP client
  # that starts a stdio server from its parameters
  "click>=8.2",
  "mcp>=2.1",
]
eval = [
  "matplotlib>=3.8",
]

[project.scripts]
ordnung = "ordnung.cli:app"

[project.urls]
Homepage = "https://github.com/ahmedEid1/ordnung"
Documentation = "https://github.com/ahmedEid1/ordnung/tree/main/docs"
Repository = "https://github.com/ahmedEid1/ordnung"
Issues = "https://github.com/ahmedEid1/ordnung/issues"
Changelog = "https://github.com/ahmedEid1/ordnung/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ordnung/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ordnung"]
artifacts = ["src/ordnung/web/dist/**", "src/ordnung/demo/demo_db/**"]

[tool.hatch.build.targets.sdist]
# no tests: they need the whole checkout (evals/, scripts/, web/)
include = ["src/ordnung", "README.md", "CHANGELOG.md", "LICENSE", "docs"]
artifacts = ["src/ordnung/web/dist/**", "src/ordnung/demo/demo_db/**"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "PTH"]

# The whole package gets every check of `mypy --strict` (evals/ and the tests aren't type-checked).
[tool.mypy]
python_version = "3.11"
files = ["src/ordnung"]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "slow: replays every recorded reading, times pages against a wall-clock budget, or counts the lines a page runs (sys.settrace, which coverage uses too); CI runs these once, without coverage (-m slow)",
]

[tool.coverage.run]
source = ["ordnung"]
omit = ["src/ordnung/web/*"]
