[project]
name = "ordnung"
version = "0.1.0"
description = "Your private AI secretary for life admin — reads your letters, bills and contracts, tracks every deadline with verifiable evidence, and reminds you before it matters. Runs locally with your own Claude subscription."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/ordnung/drafts/fonts/LICENSE-DejaVu.txt"]
requires-python = ">=3.11"
authors = [{ name = "Ahmed Hobeishy" }]
keywords = ["ai", "agent", "claude", "personal-assistant", "paperwork", "deadlines", "germany", "local-first", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
]
dependencies = [
  # Floors of what parses untrusted files and requests (Starlette, h11, multipart, PDF, images)
  # exclude releases with known CVEs.
  "fastapi>=0.115",
  "starlette>=1.3.1",
  "h11>=0.16",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "typer>=0.19",  # older ones can't build the CLI's `Path | None` and `Literal` options
  "rich>=13.7",
  "pdfplumber>=0.11.9",
  "pdfminer.six>=20260107",
  "pypdfium2>=4.30",
  "pillow>=12.3.0",
  "pillow-heif>=1.3.0",
  "holidays>=0.66",  # older ones lose the partial holidays (Fronleichnam in Saxony and Thuringia)
  "python-dateutil>=2.9",
  "icalendar>=6.1",  # the .ics export adds its time zones with add_missing_timezones
  "fpdf2>=2.8.5",  # the demo's photographed letter is recorded by the bytes fpdf2 writes
  "rapidfuzz>=3.9",
  "platformdirs>=4.2",
  "watchfiles>=0.24",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.31",
  "httpx>=0.27",
  "mcp>=2.0",
  # encrypted backups (AES-256-GCM, scrypt, HKDF); already needed by pdfminer.six
  "cryptography>=44.0.1",
  # calendar sync keeps the app password in the OS password store, never in the database
  "keyring>=25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
  "hypothesis>=6.100",
  "jsonschema>=4.20",
  # what the tests need beyond the app's own floors: CliRunner's separate stderr, and an MCP client
  # that starts a stdio server from its parameters
  "click>=8.2",
  "mcp>=2.1",
]
eval = [
  "matplotlib>=3.8",
]

[project.scripts]
ordnung = "ordnung.cli:app"

[project.urls]
Homepage = "https://github.com/ahmedEid1/ordnung"
Documentation = "https://github.com/ahmedEid1/ordnung/tree/main/docs"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordnung"]
artifacts = ["src/ordnung/web/dist/**", "src/ordnung/demo/demo_db/**"]

[tool.hatch.build.targets.sdist]
# no tests: they need the whole checkout (evals/, scripts/, web/)
include = ["src/ordnung", "README.md", "LICENSE", "docs"]
artifacts = ["src/ordnung/web/dist/**", "src/ordnung/demo/demo_db/**"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
files = ["src/ordnung"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# The pure core (date rules, recurrence, calendar, clock, ids) gets the checks of `mypy --strict`
# (`strict` itself is global-only; warn_redundant_casts and warn_unused_configs are too).
[[tool.mypy.overrides]]
module = ["ordnung.rules.*", "ordnung.recurrence", "ordnung.calendar.*", "ordnung.clock", "ordnung.ids", "ordnung.money.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
  "live: calls the real claude CLI (skipped unless ORDNUNG_LIVE_TESTS=1)",
  "slow: replays every recorded reading, or times pages against a wall-clock budget; CI runs these once, without coverage (-m slow)",
]

[tool.coverage.run]
source = ["ordnung"]
omit = ["src/ordnung/web/*"]
