name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: every dependency at its newest version (job "latest") and the dependency audit
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    if: github.event_name != 'schedule'
    # pinned: the samples' byte-for-byte check needs Ubuntu 24.04's Python 3.12 (its zlib is the manifest's)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: |
          .venv/bin/ruff check src tests scripts evals
          .venv/bin/ruff format --check src tests scripts evals
      - name: Type check
        run: .venv/bin/mypy
      - name: Tests (and pyproject.toml's coverage floor for the whole package)
        env:
          # here the samples must regenerate byte for byte (elsewhere the test skips when a library differs)
          ORDNUNG_REQUIRE_SAMPLES: ${{ matrix.python == '3.12' && '1' || '' }}
        run: .venv/bin/pytest -m "not slow" --cov=ordnung --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Coverage floors of hand-off sync and phone access (read from the run above)
        if: matrix.python == '3.12'
        run: |
          .venv/bin/coverage report --include='*/ordnung/sync/*' --skip-covered --fail-under=85
          .venv/bin/coverage report --include='*/ordnung/phone/*' --skip-covered --fail-under=89

  backend-slow:
    name: Backend, slow checks (Python 3.12)
    # the slow tests, the replayed benchmarks and demo --check: in the 3.12 leg of "backend" they took the job
    # to 36 of its 45 minutes, so a slow runner could time it out
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Slow tests (every recorded reading replayed, and the page timing; once, without coverage)
        run: .venv/bin/pytest -m slow
      - name: Rules engine keeps 100 % line and branch coverage
        run: .venv/bin/pytest tests/test_rules_*.py --cov=ordnung.rules --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100
      - name: Benchmark (replayed, deterministic)
        # the gates of this step and the next ask for as many right dates as the published replay of the
        # current code gives on each split, and none dangerously late ("with_land" in the file the step after
        # them compares with; tests/test_ci_workflow.py checks each gate against it)
        run: .venv/bin/ordnung eval --min-accuracy 0.98 --max-dangerous-late 0
      - name: Benchmark replayed on the holdout, holdout2 and dev splits (Ordnung alone, no model calls)
        run: |
          .venv/bin/ordnung eval --split holdout --conditions ordnung --min-accuracy 0.98 --max-dangerous-late 0 --quiet
          .venv/bin/ordnung eval --split holdout2 --conditions ordnung --min-accuracy 0.98 --max-dangerous-late 0 --quiet
          .venv/bin/ordnung eval --split dev --conditions ordnung --min-accuracy 0.96 --max-dangerous-late 0 --quiet
      - name: The replay without the sender's Land gives the published numbers
        env:
          PUBLISHED: evals/results/2026-10-08-claude-sonnet-5-without-land.json
        # every split replayed three ways (scripts/eval_without_land.py) into a temporary folder, then compared
        # with the published file, split by split
        run: |
          .venv/bin/python -m scripts.eval_without_land --date "$(basename "$PUBLISHED" | cut -c1-10)" \
            --out "$RUNNER_TEMP/without-land"
          .venv/bin/python - "$PUBLISHED" "$RUNNER_TEMP/without-land/$(basename "$PUBLISHED")" <<'EOF'
          import json
          import sys

          published, replayed = (json.load(open(path, encoding="utf-8"))["splits"] for path in sys.argv[1:])
          differ = sorted(name for name in published.keys() | replayed.keys() if published.get(name) != replayed.get(name))
          for name in differ:
              print(f"{name}: the replay doesn't give the published numbers", file=sys.stderr)
          sys.exit(1 if differ else 0)
          EOF
      - name: Ask benchmark (replayed, deterministic)
        # thresholds and the one known attack (the rent's own amount in a comparison): see the notes in
        # docs/evals-ask.md; --check-docs fails when the committed page or results file is not what this
        # replay writes
        run: >-
          .venv/bin/python -m evals.ask --min-accuracy 0.85 --min-abstention 0.85 --max-unsupported 0
          --max-attack-success 0 --known-attack cite-rent-for-library-overview --check-docs
      - name: Demo rebuilds identically from the samples and recordings
        run: .venv/bin/ordnung demo --check

  lowest:
    name: Lowest direct versions (Python 3.11)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install every direct dependency at its floor
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" --resolution lowest-direct
      - name: Tests
        # web/openapi.json is what the pinned FastAPI and pydantic print
        run: .venv/bin/pytest -m "not slow" --deselect tests/test_openapi_contract.py::test_web_openapi_json_is_current
      - name: Demo rebuilds identically
        run: .venv/bin/ordnung demo --check

  latest:
    name: Newest versions of every dependency (Python 3.14)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install (no constraints)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
      - name: Tests
        # web/openapi.json is what the pinned FastAPI and pydantic print
        run: .venv/bin/pytest -m "not slow" --deselect tests/test_openapi_contract.py::test_web_openapi_json_is_current
      - name: Demo rebuilds identically
        run: .venv/bin/ordnung demo --check

  rules-age:
    name: Rules checked against the law in the last 90 days
    # weekly: fails once LAST_CHECKED (src/ordnung/rules/catalog.py) is more than 90 days old, and names the
    # pending changes to re-check (scripts/check_rules_age.py); pull requests never fail on it
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e . -c constraints.txt
      - name: LAST_CHECKED is at most 90 days old
        run: .venv/bin/python -m scripts.check_rules_age

  claude-code:
    name: Claude Code takes Ordnung's flags (${{ matrix.claude }})
    # weekly: installs the real Claude Code the way the README says (Anthropic's installer), the newest and the
    # oldest Ordnung takes, and checks every flag Ordnung passes (scripts/check_claude_flags.py) without signing
    # in: no account, nothing on its input, no tokens. While the job is new a failure shows here without
    # failing the run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        claude: [latest, "2.1.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install Ordnung
        run: |
          uv venv .venv
          uv pip install -e . -c constraints.txt
      - name: Install Claude Code with Anthropic's installer
        run: curl -fsSL https://claude.ai/install.sh | bash -s ${{ matrix.claude }}
      - name: Claude Code takes every flag Ordnung passes (not signed in)
        run: .venv/bin/python -m scripts.check_claude_flags --claude "$HOME/.local/bin/claude"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Python packages (the versions in constraints.txt)
        run: uvx pip-audit --strict --no-deps --disable-pip -r constraints.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The web app's own packages
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  wheel:
    name: Wheel installs and runs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: The wheel carries the built web app
        run: unzip -l dist/ordnung-*.whl | grep -q " ordnung/web/dist/index.html$"
      - name: Install the wheel into a clean venv and run it (outside the checkout)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ordnung/__init__.py)
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/ordnung-*.whl -c constraints.txt
          cd "$RUNNER_TEMP"
          reported=$("$RUNNER_TEMP/wheel/bin/ordnung" --version) && echo "$reported"
          test "$reported" = "ordnung $version"
          "$RUNNER_TEMP/wheel/bin/ordnung" demo --check

  other-systems:
    name: Other systems (${{ matrix.os }}, Python 3.12)
    # the lock, durable writes, sync's computer id, phone access's network lookups and autostart differ on
    # macOS and Windows: on main, by hand and weekly (not on pull requests); while the job is new a failure
    # shows here without failing the run
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # a Windows console prints any character; the runner's pipe would use the ANSI code page
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install (the versions in constraints.txt)
        id: install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Build the wheel and install it into a clean venv
        id: wheel
        run: |
          uv build --wheel
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/ordnung-*.whl -c constraints.txt
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/wheel/Scripts"; else bin="$RUNNER_TEMP/wheel/bin"; fi
          echo "WHEEL_BIN=$bin" >> "$GITHUB_ENV"
      - name: The wheel reports this version and rebuilds the demo identically (outside the checkout)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ordnung/__init__.py)
          cd "$RUNNER_TEMP"
          reported=$("$WHEEL_BIN/ordnung" --version | tr -d '\r') && echo "$reported"
          test "$reported" = "ordnung $version"
          "$WHEEL_BIN/ordnung" demo --check
          # the postcode table ships in the wheel and reads as UTF-8 here
          "$WHEEL_BIN/python" -c "from ordnung.rules.postcodes import land_of_postcode as f; assert f('80331') == 'BY'"
      - name: The doctor passes, but for Claude Code (not set up here)
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          ORDNUNG_HOME: ${{ runner.temp }}/ordnung-data
        run: |
          # it exits 1 when a check fails: Claude's checks may (no `claude`, or not signed in), every other
          # check must pass, and the exit code must say which
          code=0
          "$WHEEL_BIN/ordnung" doctor || code=$?
          "$WHEEL_BIN/python" - "$code" <<'EOF'
          import sys
          from ordnung.config import default_data_dir
          from ordnung.doctor import run_doctor_sync

          failed = [check.id for check in run_doctor_sync(default_data_dir()).checks if check.status == "fail"]
          assert all(name.startswith("claude") for name in failed), failed
          assert int(sys.argv[1]) == (1 if failed else 0), (sys.argv[1], failed)
          EOF
      - name: Tests of the code that differs per system
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [ -d .venv/Scripts ]; then venv=.venv/Scripts; else venv=.venv/bin; fi
          "$venv/python" -m pytest -m "not slow" tests/test_platform_smoke.py \
            tests/test_cli.py::test_the_lock_keeps_a_second_writer_out \
            tests/test_cli.py::test_the_lock_waits_up_to_its_timeout \
            tests/test_cli.py::test_a_lock_held_by_another_process_blocks_until_it_exits \
            tests/test_sync_*.py tests/test_phone_net.py tests/test_phone_tls.py tests/test_phone_listener.py \
            tests/test_autostart.py tests/test_backup.py tests/test_backup_container.py \
            tests/test_rules_postcodes.py tests/test_make_postcode_table.py

  frontend:
    name: Frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Committed web build is up to date
        run: node scripts/source-hash.mjs --check ../src/ordnung/web/dist/build-info.json
      - run: npm run build

  e2e:
    name: End-to-end (demo and real app)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: Checks that need both toolchains (node + web/node_modules and the Python package)
        # the static demo's My numbers and weekly session match the Python code; the README's Vitest and
        # Playwright counts hold. Only this job has both, so here they must run instead of skipping.
        env:
          ORDNUNG_REQUIRE_MOCK_CHECK: "1"
        run: >-
          .venv/bin/pytest -q tests/test_mock_numbers.py
          tests/test_docs_claims.py::test_readme_vitest_and_playwright_counts_hold
      - name: Build UI
        run: cd web && npm run build
      - name: Playwright (the demo; then the real app reading with a fake Claude)
        # playwright.config.ts starts `ordnung demo --reset` and `ordnung serve` with tests/fake_claude.py from
        # .venv, plus a second `ordnung serve` (hand-off sync's other computer; both real apps keep secrets in the
        # file keyring of tests/e2e_support), and logs in to all three with their tokens; its projects run in
        # order: tour, pages, sweep, layout, girocode, high-stakes, add-date (the demo), then real-app
        # (e2e/real-app-*.spec.ts)
        run: cd web && npm run e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
