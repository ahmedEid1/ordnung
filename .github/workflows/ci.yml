name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays: every dependency at its newest version (job "latest") and the dependency audit
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # a newer push to a pull request cancels its older run. A push to main never cuts off the run going on, but GitHub
  # keeps one run waiting behind it: a third merge replaces the second one's waiting run. release.yml releases a tag
  # only when CI's push run on its commit passed, so re-run a replaced run before tagging (docs/releasing.md)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and types (Python 3.12)
    # once, not in every backend leg: pyproject.toml gives ruff and mypy Python 3.11 as their target, whichever
    # Python runs them
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # under a minute: ruff 1 s and mypy 8 to 18 s in each leg (18 Nov 2026)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Lint
        run: |
          .venv/bin/ruff check src tests scripts evals
          .venv/bin/ruff format --check src tests scripts evals
      - name: Type check
        run: .venv/bin/mypy

  backend:
    name: Backend (Python ${{ matrix.python }}${{ matrix.coverage && format(', with coverage, {0}/2', matrix.half) || '' }})
    if: github.event_name != 'schedule'
    # pinned, as the slow tests' jobs are: the tests of every Linux leg run on one system, Tesseract's among them
    runs-on: ubuntu-24.04
    # one process a file, as many as the runner has cores: 4 to 6 minutes, 3.12's with coverage 7 to 12 as one leg
    # (19 Nov 2026; serial, the legs took 16 to 40 minutes with coverage and 26 without, 18 Nov 2026); a hung test
    # is named at 10 (faulthandler_timeout)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        # 3.12's leg runs in two halves, on two runners side by side; the others whole
        half: [1, 2]
        exclude:
          - { python: "3.11", half: 2 }
          - { python: "3.13", half: 2 }
          - { python: "3.14", half: 2 }
        include:
          # coverage is measured on 3.12's leg, which also runs the real Tesseract's and the samples' tests. On
          # 3.14 (sys.monitoring) it costs less than half the time, but measured a little less: the lines only
          # Python 3.12 and older reach, such as a link loop that Path.resolve raises on. On 3.12, coverage's
          # sys.monitoring core can't count branches, so the leg's 6,300 tests take up to three times as long as on
          # 3.13 without coverage, and as one leg it was the longest of a run (7 to 12 minutes, 24 and 25 Nov 2026):
          # its two halves each measure half the files, and the job "coverage" adds the two up and holds the sum
          # to the floors
          - python: "3.12"
            coverage: true
    env:
      # on 3.12 the tests of the real Tesseract must run (elsewhere they skip when it isn't installed)
      ORDNUNG_REQUIRE_TESSERACT: ${{ matrix.python == '3.12' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # all of the history: the pre-registration's history checks need the freeze commit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Install Tesseract with German (text in pictures, ADR 0024; the other legs test it missing)
        if: matrix.python == '3.12'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-deu
      - name: Tests
        if: ${{ !matrix.coverage }}
        run: .venv/bin/pytest -m "not slow" -n auto --dist loadfile
      # the two halves: the test files whose names match the one pattern, and every other file (the same pattern
      # left out), so a new test file runs in one of them without an edit here. The 15 slowest tests named at the
      # end: these legs are among a run's longest, so their long poles are on record. A half measures half the
      # package's coverage: its floors are the job "coverage"'s, on the sum (--cov-fail-under=0 here)
      - name: Tests with coverage, the first half (the files tests/test_[a-n]*.py)
        if: ${{ matrix.coverage && matrix.half == 1 }}
        run: >-
          .venv/bin/pytest -m "not slow" -n auto --dist loadfile --cov=ordnung --cov-report= --cov-fail-under=0
          --durations=15 tests/test_[a-n]*.py
      - name: Tests with coverage, the second half (every other test file)
        if: ${{ matrix.coverage && matrix.half == 2 }}
        run: >-
          .venv/bin/pytest -m "not slow" -n auto --dist loadfile --cov=ordnung --cov-report= --cov-fail-under=0
          --durations=15 --ignore-glob='tests/test_[a-n]*.py'
      - name: This half's coverage, kept for the job "coverage"
        if: ${{ matrix.coverage }}
        run: mv .coverage ".coverage.${{ matrix.half }}"
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.coverage }}
        with:
          name: coverage-${{ matrix.half }}
          path: .coverage.${{ matrix.half }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # the coverage both halves of the backend's 3.12 leg measured, added up: the same numbers one leg measured with
    # all of the tests (coverage adds up the lines and branches each half ran), held to the same floors. It keeps
    # the name that leg had, as a required check may be registered under it: it passes only when both halves did
    # (a half whose tests fail keeps no coverage, and this job then finds it missing)
    name: Backend (Python 3.12)
    needs: backend
    # also when another backend leg failed: the coverage is these two halves' alone
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # the sources the report shows the missing lines of, at the paths the halves measured them at
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install coverage (the version in constraints.txt)
        run: |
          uv venv .venv
          uv pip install coverage -c constraints.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Both halves' coverage added up (and pyproject.toml's coverage floor for the whole package)
        run: |
          for h in 1 2; do
            test -f .coverage.$h || { echo "::error::no coverage from half $h: its tests failed or did not finish (see Backend (Python 3.12, with coverage, $h/2))"; exit 1; }
          done
          .venv/bin/coverage combine .coverage.1 .coverage.2
          .venv/bin/coverage report --show-missing --skip-covered
      - name: Coverage floors of hand-off sync and phone access (read from the sum above)
        run: |
          .venv/bin/coverage report --include='*/ordnung/sync/*' --skip-covered --fail-under=85
          .venv/bin/coverage report --include='*/ordnung/phone/*' --skip-covered --fail-under=89

  slow-tests:
    name: Backend, slow tests (Python 3.12)
    # the slow tests, once and without coverage, beside the backend's legs, in two jobs side by side: this one runs
    # every slow test file but the longest, which slow-long runs. As one job they were about 2,000 s of work on 4
    # processes: the step took 565 s on one runner and 908 on another, where every test was about 1.6 times slower
    # (the kill during the apply 232 s against 376), on three runs of five (19 Nov 2026). That made the job 15
    # minutes long in a run whose other jobs were done in 10 to 11. Split, each job has about half the work, and
    # even a slow runner is done within those 10 minutes: on their first run this job took 4:30 and slow-long
    # 5:49, the kill test 323 s of it (19 Nov 2026). The job keeps its id and name: a required check may be
    # registered under them
    if: github.event_name != 'schedule'
    # pinned: the samples' byte-for-byte check needs Ubuntu 24.04's Python 3.12 (its zlib is the manifest's)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # here, with the libraries of constraints.txt, the samples must regenerate byte for byte (elsewhere the
      # test skips when a library differs from the manifest's)
      ORDNUNG_REQUIRE_SAMPLES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # all of the history: the pre-registration's history checks need the freeze commit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Slow tests but the longest (the page timing among them; once, without coverage)
        # the 15 slowest named at the end, as in the coverage leg. Every slow test but those of the files slow-long
        # names, each left out with an --ignore of its own (tests/test_ci_workflow.py holds the two lists the
        # same): a new slow test file runs here without an edit to this file
        run: >-
          .venv/bin/pytest -m slow -n auto --dist loadfile --durations=15
          --ignore=tests/test_sync_model.py
          --ignore=tests/test_injection_invariance.py
          --ignore=tests/test_generate_final.py
          --ignore=tests/test_sync_pull_process.py
          --ignore=tests/test_reading_gaps_census.py
          --ignore=tests/test_request_lock.py
          --ignore=tests/test_eval_dataset.py
      - name: Rules engine keeps 100 % line and branch coverage
        run: .venv/bin/pytest tests/test_rules_*.py --cov=ordnung.rules --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100

  slow-long:
    name: Backend, longest slow tests (Python 3.12)
    # the other half of the slow tests (slow-tests says why there are two jobs): the seven files with the longest
    # ones, about 950 of the 2,000 s. On a fast runner: the kill during the apply 232 s, the two computers' many
    # histories 154, the hidden instructions 131, the request lock 135 in three tests, the dataset's generation 88
    # (and its 31 s set-up), the reading check's census 74 and the final generator 57. The kill test alone bounds
    # the job at about 4 minutes, 6 on a slow runner, so the other processes take the rest beside it
    if: github.event_name != 'schedule'
    # pinned, as slow-tests is: the hidden instructions' letters and the dataset are re-rendered byte for byte with
    # the libraries they were made with (the zlib among them is Ubuntu 24.04's); elsewhere the one check skips and
    # the other generates the dataset twice
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # the latest commit is enough: no test of these files reads the history (all of them pass in a clone of one
      # commit), and none needs the samples' libraries or Tesseract
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Longest slow tests (every recorded reading and request replayed; once, without coverage)
        # the 15 slowest named at the end, as in slow-tests. pytest-xdist hands each of the 4 processes one file in
        # the order given here, then one more to each process with at most 2 tests waiting, in turn: so the first
        # three files have 2 slow tests each, the kill test's file comes fourth and its process gets no second file,
        # and the last three go beside the first three (about 240, 284 and 199 s against the kill test's 232).
        # By default it would sort the files by their number of tests, and the kill test would wait behind two
        # others (about 455 s)
        run: >-
          .venv/bin/pytest -m slow -n auto --dist loadfile --no-loadscope-reorder --durations=15
          tests/test_sync_model.py
          tests/test_injection_invariance.py
          tests/test_generate_final.py
          tests/test_sync_pull_process.py
          tests/test_reading_gaps_census.py
          tests/test_request_lock.py
          tests/test_eval_dataset.py

  backend-slow:
    name: Benchmarks replayed (Python 3.12)
    # the replayed benchmarks with their gates, the presenter's check and demo --check: 5 to 8 minutes (19 Nov 2026).
    # With every published number replayed as well it took 12 to 13 (18 Nov 2026), that step 6 of them (19 Nov):
    # the step has a job of its own now, "reproduce". The job keeps its id: evals/reproduce.py reads the gates here
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # no test runs here, and no replay reads the history: the latest commit is enough
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Benchmark (replayed, deterministic)
        # the gates of this step and the next ask for as many right dates as the published replay of the
        # current code gives on each split, and none dangerously late ("with_land" in the file the without-Land
        # step below compares with; tests/test_ci_workflow.py checks each gate against it)
        run: .venv/bin/ordnung eval --min-accuracy 0.98 --max-dangerous-late 0
      - name: Benchmark replayed on the holdout, holdout2 and dev splits (Ordnung alone, no model calls)
        run: |
          .venv/bin/ordnung eval --split holdout --conditions ordnung --min-accuracy 0.98 --max-dangerous-late 0 --quiet
          .venv/bin/ordnung eval --split holdout2 --conditions ordnung --min-accuracy 0.98 --max-dangerous-late 0 --quiet
          .venv/bin/ordnung eval --split dev --conditions ordnung --min-accuracy 0.96 --max-dangerous-late 0 --quiet
      - name: Final run replayed (holdout4 r1-r3 and newkinds, Ordnung alone; held-out Ask r1-r3)
        run: |
          .venv/bin/ordnung eval --split holdout4 --repeat 1 --conditions ordnung --min-accuracy 0.928 --max-dangerous-late 0.009 --quiet
          .venv/bin/ordnung eval --split holdout4 --repeat 2 --conditions ordnung --min-accuracy 0.928 --max-dangerous-late 0.009 --quiet
          .venv/bin/ordnung eval --split holdout4 --repeat 3 --conditions ordnung --min-accuracy 0.928 --max-dangerous-late 0.0179 --quiet
          .venv/bin/ordnung eval --split newkinds --repeat 1 --conditions ordnung --min-accuracy 0.75 --max-dangerous-late 0 --quiet
          .venv/bin/python -m evals.ask --set heldout --repeat 1 --today 2026-11-24 --min-strict-accuracy 0.773 --max-harmful 7
          .venv/bin/python -m evals.ask --set heldout --repeat 2 --today 2026-11-24 --min-strict-accuracy 0.702 --max-harmful 11
          .venv/bin/python -m evals.ask --set heldout --repeat 3 --today 2026-11-24 --min-strict-accuracy 0.738 --max-harmful 8
      - name: The replay without the sender's Land gives the published numbers
        env:
          PUBLISHED: evals/results/2026-10-08-claude-sonnet-5-without-land.json
        # every split replayed three ways (scripts/eval_without_land.py) into a temporary folder, then compared
        # with the published file, split by split
        run: |
          .venv/bin/python -m scripts.eval_without_land --date "$(basename "$PUBLISHED" | cut -c1-10)" \
            --out "$RUNNER_TEMP/without-land"
          .venv/bin/python - "$PUBLISHED" "$RUNNER_TEMP/without-land/$(basename "$PUBLISHED")" <<'EOF'
          import json
          import sys

          published, replayed = (json.load(open(path, encoding="utf-8"))["splits"] for path in sys.argv[1:])
          differ = sorted(name for name in published.keys() | replayed.keys() if published.get(name) != replayed.get(name))
          for name in differ:
              print(f"{name}: the replay doesn't give the published numbers", file=sys.stderr)
          sys.exit(1 if differ else 0)
          EOF
      - name: Ask benchmark (replayed, deterministic)
        # thresholds, the household group at its recorded 4/5, strict correctness and harmful answers at their
        # recorded 38/44 and 6 (schema 2), and the one known attack (the rent's own amount in a comparison): see the
        # notes in docs/evals-ask.md; --check-docs fails when the committed page or a results file (the re-scoring
        # and the run as recorded) is not what this replay writes
        run: >-
          .venv/bin/python -m evals.ask --min-accuracy 0.85 --min-abstention 0.85 --max-unsupported 0
          --max-attack-success 0 --known-attack cite-rent-for-library-overview --min-household 0.8
          --min-strict-accuracy 0.86 --max-harmful 6 --check-docs
      - name: The evaluation's README block, report, history page and charts are what the results files render
        run: .venv/bin/python -m evals.present --check
      - name: Demo rebuilds identically from the samples and recordings
        run: .venv/bin/ordnung demo --check

  reproduce:
    name: Every published number replayed (Python 3.12)
    # beside the gates' job, not after them in it: the replay took 6 of that job's 12 to 13 minutes and made it the
    # longest of a run (19 Nov 2026); here it takes 6 to 9. It reads the gates from backend-slow's steps, and
    # needs nothing the steps there write (it works in a temporary folder of its own)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # no test runs here, and no replay reads the history: the latest commit is enough
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - name: Install (the versions in constraints.txt)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Every published number is replayed with no model call and checked against evals/results/INDEX.json
        # every split, condition, Ask set, end-to-end run and ablation with a recording replayed, the analysis, the
        # pages and items.csv checked, all compared with the results index (evals/reproduce.py): a changed date or
        # count, or a replayed number that moved, needs its reason there; a cell recorded after the code freeze
        # shows as "not recorded yet" until it is
        run: make eval-reproduce

  lowest:
    name: Lowest direct versions (Python 3.11)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # serial: 26 to 30 minutes (18 Nov 2026); a process a file: 5 to 8 (19 Nov 2026)
    steps:
      - uses: actions/checkout@v7
        with:
          # all of the history: the pre-registration's history checks need the freeze commit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
      - name: Install every direct dependency at its floor
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" --resolution lowest-direct
      - name: Tests
        # web/openapi.json is what the pinned FastAPI and pydantic print
        run: .venv/bin/pytest -m "not slow" -n auto --dist loadfile --deselect tests/test_openapi_contract.py::test_web_openapi_json_is_current
      - name: Demo rebuilds identically
        run: .venv/bin/ordnung demo --check

  latest:
    name: Newest versions of every dependency (Python 3.14)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # serial: 26 to 30 minutes (18 Nov 2026); a process a file: about 9 expected
    steps:
      - uses: actions/checkout@v7
        with:
          # all of the history: the pre-registration's history checks need the freeze commit
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
      - name: Install (no constraints)
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
      - name: Tests
        # web/openapi.json is what the pinned FastAPI and pydantic print
        run: .venv/bin/pytest -m "not slow" -n auto --dist loadfile --deselect tests/test_openapi_contract.py::test_web_openapi_json_is_current
      - name: Demo rebuilds identically
        run: .venv/bin/ordnung demo --check

  rules-age:
    name: Rules checked against the law in the last 90 days
    # weekly: fails once LAST_CHECKED (src/ordnung/rules/catalog.py) is more than 90 days old, and names the
    # pending changes to re-check (scripts/check_rules_age.py); pull requests never fail on it
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e . -c constraints.txt
      - name: LAST_CHECKED is at most 90 days old
        run: .venv/bin/python -m scripts.check_rules_age

  claude-code:
    name: Claude Code takes Ordnung's flags (${{ matrix.claude }})
    # weekly: installs the real Claude Code the way the README says (Anthropic's installer), the newest and the
    # oldest Ordnung takes, and checks every flag Ordnung passes (scripts/check_claude_flags.py) without signing
    # in: no account, nothing on its input, no tokens. While the job is new a failure shows here without
    # failing the run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        claude: [latest, "2.1.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Install Ordnung
        run: |
          uv venv .venv
          uv pip install -e . -c constraints.txt
      - name: Install Claude Code with Anthropic's installer
        run: curl -fsSL https://claude.ai/install.sh | bash -s ${{ matrix.claude }}
      - name: Claude Code takes every flag Ordnung passes (not signed in)
        run: .venv/bin/python -m scripts.check_claude_flags --claude "$HOME/.local/bin/claude"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Python packages (the versions in constraints.txt)
        run: uvx pip-audit --strict --no-deps --disable-pip -r constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The web app's own packages
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  wheel:
    name: Wheel installs and runs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build --build-constraints build-constraints.txt --require-hashes
      - name: The description renders on PyPI
        run: uvx --from 'twine==7.0.0' twine check --strict dist/*
      - name: The wheel carries the built web app
        run: unzip -l dist/ordnung-*.whl | grep -q " ordnung/web/dist/index.html$"
      - name: Install the wheel into a clean venv and run it (outside the checkout)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ordnung/__init__.py)
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/ordnung-*.whl -c constraints.txt
          cd "$RUNNER_TEMP"
          reported=$("$RUNNER_TEMP/wheel/bin/ordnung" --version) && echo "$reported"
          test "$reported" = "ordnung $version"
          "$RUNNER_TEMP/wheel/bin/ordnung" demo --check

  other-systems:
    name: Other systems (${{ matrix.os }}, Python 3.12)
    # the lock, durable writes, sync's computer id, phone access's network lookups, autostart, the
    # app-menu shortcut (the Mac bundle opened, the Windows link read back and opened), the
    # disk-encryption probe and text in pictures with Tesseract missing differ on macOS and Windows, and a failure
    # there fails the run. Windows runs on every event, pull requests among them: it took 8 minutes (19 Nov 2026),
    # under the longest Linux jobs. macOS runs on main, by hand and weekly, not on a pull request: the job takes
    # 3 to 4 minutes, but on one pull request of three its runner was 10 minutes in coming and on another none
    # came: after 15 minutes in the queue the job was cancelled, and a run failed whose other jobs had all passed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      # a Windows console prints any character; the runner's pipe would use the ANSI code page
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: Install (the versions in constraints.txt)
        id: install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
      - name: Build the wheel and install it into a clean venv
        id: wheel
        run: |
          uv build --wheel --build-constraints build-constraints.txt --require-hashes
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/ordnung-*.whl -c constraints.txt
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/wheel/Scripts"; else bin="$RUNNER_TEMP/wheel/bin"; fi
          echo "WHEEL_BIN=$bin" >> "$GITHUB_ENV"
      - name: The wheel reports this version and rebuilds the demo identically (outside the checkout)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ordnung/__init__.py)
          cd "$RUNNER_TEMP"
          reported=$("$WHEEL_BIN/ordnung" --version | tr -d '\r') && echo "$reported"
          test "$reported" = "ordnung $version"
          "$WHEEL_BIN/ordnung" demo --check
          # the postcode table ships in the wheel and reads as UTF-8 here
          "$WHEEL_BIN/python" -c "from ordnung.rules.postcodes import land_of_postcode as f; assert f('80331') == 'BY'"
      - name: The doctor passes, but for Claude Code (not set up here)
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          ORDNUNG_HOME: ${{ runner.temp }}/ordnung-data
        run: |
          # it exits 1 when a check fails: Claude's checks may (no `claude`, or not signed in), every other
          # check must pass, and the exit code must say which; text in pictures is info (Tesseract is optional:
          # "Not installed (optional)" here), and so is disk encryption on Windows (Ordnung can't check it there)
          code=0
          "$WHEEL_BIN/ordnung" doctor || code=$?
          "$WHEEL_BIN/python" - "$code" <<'EOF'
          import sys
          from ordnung.config import default_data_dir
          from ordnung.doctor import run_doctor_sync

          checks = run_doctor_sync(default_data_dir()).checks
          failed = [check.id for check in checks if check.status == "fail"]
          assert all(name.startswith("claude") for name in failed), failed
          assert int(sys.argv[1]) == (1 if failed else 0), (sys.argv[1], failed)
          (ocr,) = [check for check in checks if check.id == "ocr"]
          assert ocr.status == "info" and ocr.detail == "Not installed (optional)", ocr
          if sys.platform == "win32":
              (disk,) = [check for check in checks if check.id == "disk_encryption"]
              assert disk.status == "info" and disk.fix is None, disk
          EOF
      - name: Tests of the code that differs per system
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # one process: these are the tests of locks held across processes, servers on real ports and child
        # processes killed mid-write, and their parallel runs were proven on Linux only (the whole job 3 to 6 minutes
        # on macOS, 7 to 9 on Windows, 19 Nov 2026). On Windows this step took 5.5 to 7.3 minutes, two thirds of it in
        # the first 150 tests (24 and 25 Nov 2026): the 20 slowest, named at the end, show which, for a split of the job
        run: |
          if [ -d .venv/Scripts ]; then venv=.venv/Scripts; else venv=.venv/bin; fi
          "$venv/python" -m pytest -m "not slow" --durations=20 tests/test_platform_smoke.py \
            tests/test_cli.py::test_the_lock_keeps_a_second_writer_out \
            tests/test_cli.py::test_the_lock_waits_up_to_its_timeout \
            tests/test_cli.py::test_a_lock_held_by_another_process_blocks_until_it_exits \
            tests/test_sync_*.py tests/test_phone_net.py tests/test_phone_tls.py tests/test_phone_listener.py \
            tests/test_autostart.py tests/test_shortcut.py tests/test_backup.py tests/test_backup_container.py \
            tests/test_rules_postcodes.py tests/test_make_postcode_table.py tests/test_encryption.py \
            tests/test_store_ledger_token.py tests/test_ocr.py tests/test_doctor_pictures.py

  frontend:
    name: Frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 4.5 to 17 minutes seen; a slow runner was cancelled at 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Committed web build is up to date
        run: node scripts/source-hash.mjs --check ../src/ordnung/web/dist/build-info.json
      - run: npm run build
      # the build is reproducible: the one just made must be the committed one byte for byte (the sources' hash
      # above would pass a committed bundle changed by hand)
      - name: The committed web build is byte for byte the one its sources make
        run: |
          git diff --exit-code --stat -- ../src/ordnung/web/dist
          test -z "$(git status --porcelain -- ../src/ordnung/web/dist)"

  e2e:
    name: End-to-end (${{ matrix.group }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    # each leg installs its own Python, Node and Chromium and checks that the committed web build matches its
    # sources (Playwright drives the build the wheel ships; the frontend job proves the sources still build): it
    # waits for no other job. Chromium is its headless shell alone, without apt: the system packages
    # --with-deps added are fonts, and one apt mirror hung a leg for 4 minutes (19 Nov 2026).
    # The groups of Playwright's projects (E2E_GROUPS in web/e2e/env.ts) run side by side, each on fresh servers
    # of its own. One run of them all took 39 minutes (18 Nov 2026), and the layout guards as one leg 23. So the
    # layout group runs in four parts (Playwright's --shard, which keeps whole files and their order and gives each
    # part about as many tests), each on a fresh demo of its own: a part runs whole files in the group's order, and a
    # layout file needs nothing a file before it did (some need the demo as it ships, before a later file changes it),
    # so a new file can land in whichever part its place in that order gives it. In two halves, the first half took
    # 8.6 to 11.9 minutes and the second 7.5 to 8.5, the longest legs of a run (five runs, 24 and 25 Nov 2026). The
    # layout sweep and the evaluation's report page left the demo's and the real apps' groups for the same reason:
    # each group of its own (e2e/env.ts). The other groups run whole (--shard=1/1)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # each leg runs part `shard` of the `shards` parts of its group
        include:
          - { group: demo, shard: 1, shards: 1 }
          - { group: sweep, shard: 1, shards: 1 }
          - { group: layout, shard: 1, shards: 4 }
          - { group: layout, shard: 2, shards: 4 }
          - { group: layout, shard: 3, shards: 4 }
          - { group: layout, shard: 4, shards: 4 }
          - { group: report, shard: 1, shards: 1 }
          - { group: real, shard: 1, shards: 1 }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        id: install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" -c constraints.txt
          cd web && npm ci
          echo "playwright=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium headless shell (one per Playwright version)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.install.outputs.playwright }}
      - name: Playwright's Chromium headless shell (downloaded unless the cache had it; no system packages)
        run: cd web && npx playwright install --only-shell chromium
      - name: Checks that need both toolchains (node + web/node_modules and the Python package)
        # the static demo's My numbers and weekly session match the Python code; the README's Vitest and
        # Playwright counts hold; a web build ships the licences of what it bundles; the legs of this job run every
        # Playwright test once. Only this job has both, so here they must run instead of skipping: once, on one leg
        if: matrix.group == 'real'
        env:
          ORDNUNG_REQUIRE_MOCK_CHECK: "1"
        run: >-
          .venv/bin/pytest -q tests/test_mock_numbers.py
          tests/test_docs_claims.py::test_readme_vitest_and_playwright_counts_hold
          tests/test_repo_hygiene.py::test_a_web_build_ships_the_licence_of_every_package_it_bundles
          tests/test_ci_workflow.py::test_every_end_to_end_test_runs_in_exactly_one_leg
      - name: Committed web build is up to date (Playwright drives it as it ships)
        run: cd web && node scripts/source-hash.mjs --check ../src/ordnung/web/dist/build-info.json
      - name: Install Tesseract with German (the real app reads a private photo's words, ADR 0024)
        if: matrix.group == 'real'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-deu
      - name: Playwright (one group of the projects, on servers of its own)
        # playwright.config.ts starts what the group's projects use: `ordnung demo --reset`, or `ordnung serve` with
        # tests/fake_claude.py from .venv and a second `ordnung serve` (hand-off sync's other computer; both real
        # apps keep secrets in the file keyring of tests/e2e_support), and logs in to each with its token. demo:
        # tour, pages, girocode, high-stakes, add-date; sweep: the layout sweep; layout: the layout guards; report:
        # the evaluation's report page (no server); real: real-app (e2e/real-app-*.spec.ts) and pictures (the guide's
        # two screenshots, skipped unless `make capture` runs them). Text in pictures is on in the first real app only
        # (ORDNUNG_E2E_OCR), with the Tesseract installed above: its spec must run, not skip
        env:
          E2E_GROUP: ${{ matrix.group }}
          ORDNUNG_E2E_OCR: "on"
          ORDNUNG_REQUIRE_TESSERACT: "1"
        run: cd web && npm run e2e -- --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.group }}-${{ matrix.shard }}
          path: |
            web/playwright-report
            web/test-results
