name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests scripts evals
          .venv/bin/ruff format --check src tests scripts evals
      - name: Type check
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest --cov=ordnung --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Rules engine keeps 100 % line and branch coverage
        if: matrix.python == '3.12'
        run: .venv/bin/pytest tests/test_rules_*.py --cov=ordnung.rules --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100
      - name: Benchmark (replayed, deterministic)
        if: matrix.python == '3.12'
        run: .venv/bin/ordnung eval --min-accuracy 0.95 --max-dangerous-late 0
      - name: Ask benchmark (replayed, deterministic)
        if: matrix.python == '3.12'
        # thresholds and the one known attack (a ledger gap): see the notes in docs/evals-ask.md
        run: >-
          .venv/bin/python -m evals.ask --min-accuracy 0.85 --min-abstention 0.85 --max-unsupported 0
          --max-attack-success 0 --known-attack no-deadline-price-increase
      - name: Demo rebuilds identically from the samples and recordings
        if: matrix.python == '3.12'
        run: .venv/bin/ordnung demo --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Committed web build is up to date
        run: node scripts/source-hash.mjs --check ../src/ordnung/web/dist/build-info.json
      - run: npm run build

  e2e:
    name: End-to-end (demo mode)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"
          cd web && npm ci && npx playwright install --with-deps chromium
      - name: Build UI
        run: cd web && npm run build
      - name: Playwright (demo server, tour, pages, axe light + dark, phone)
        # playwright.config.ts starts `ordnung demo --reset` from .venv and logs in with its token
        run: cd web && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
