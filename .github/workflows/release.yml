name: Release

# A pushed version tag (`git tag -a v0.3.0 <merge commit>`, then `git push origin v0.3.0`: docs/releasing.md)
# builds the sdist and the wheel from that commit, checks them as CI's wheel job does, and publishes a GitHub
# Release with CHANGELOG.md's section for that version. PyPI follows only once the owner has set it up: the
# repository variable PYPI_PUBLISH is "true" and PyPI trusts this workflow (Trusted Publishing), so no token is
# stored anywhere. The environment "pypi" guards that job only if the owner created it first, with its tag rule
# and a required reviewer: GitHub creates an environment a job names, without any rules. The tests are not run
# again: the tagged commit must be on main, and CI must have passed there. Those checks live in the tagged
# commit's own copy of this file, so they catch honest mistakes; the reviewer and a tag ruleset stop the rest.
#
# Every action runs a fixed commit (its version beside it; Dependabot updates both), never a tag that can be
# moved, and the build restores no cache: the PyPI job holds the token PyPI accepts as the owner.
on:
  push:
    tags: ["v*"]

# nothing by default: each job names what it needs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # CI's runs, to check that CI passed on the tagged commit
      actions: read
    outputs:
      version: ${{ steps.notes.outputs.version }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # all of main's history, for the check that the tagged commit is on it
          fetch-depth: 0
          persist-credentials: false
      - name: The tag names this version, and CHANGELOG.md has its section (the release's notes)
        id: notes
        run: python3 scripts/release_notes.py --tag "$GITHUB_REF_NAME" --out release-notes.md
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CI passed on the tagged commit (its run on main; a scheduled run skips the tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success"
          passed=$(gh api "$runs" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI hasn't passed on main for $GITHUB_SHA (yet). Wait until it has, then re-run this workflow."
            exit 1
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: The committed web build is the one its sources make
        working-directory: web
        run: node scripts/source-hash.mjs --check ../src/ordnung/web/dist/build-info.json
      - name: Build sdist and wheel
        run: uv build
      - name: The wheel carries the built web app and the demo
        run: |
          unzip -l dist/ordnung-*.whl | grep -q " ordnung/web/dist/index.html$"
          unzip -l dist/ordnung-*.whl | grep -q " ordnung/demo/demo_db/ordnung.db$"
      - name: The description renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean venv and run it (outside the checkout)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/ordnung/__init__.py)
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/ordnung-*.whl -c constraints.txt
          cd "$RUNNER_TEMP"
          reported=$("$RUNNER_TEMP/wheel/bin/ordnung" --version) && echo "$reported"
          test "$reported" = "ordnung $version"
          "$RUNNER_TEMP/wheel/bin/ordnung" demo --check
      # dist/ holds the two distributions and nothing else: the PyPI job uploads all of it
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: notes
          path: release-notes.md
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the run's own token, which ends with the run; this job runs no code from the repository
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: notes
          path: notes
      - name: Publish the release with the changelog's section and both files
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Ordnung ${GITHUB_REF_NAME#v}" --notes-file notes/release-notes.md "${flags[@]}"

  pypi:
    name: PyPI (Trusted Publishing)
    # last, after the GitHub Release: PyPI never takes the same version twice. Off until the owner has set PyPI
    # up (docs/releasing.md); never for a pull request or a fork
    needs: [build, github-release]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'ahmedEid1/ordnung' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ordnung/${{ needs.build.outputs.version }}/
    # the OIDC token PyPI checks against its trusted publisher: no password, no API token
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
