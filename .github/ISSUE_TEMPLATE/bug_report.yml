name: Bug report
description: Something in Ordnung doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach real letters or personal data.** Issues are public, for everyone, for good. No
        scans, photos, PDFs or e-mails of real letters, no screenshots that show names, addresses, IBANs,
        tax, customer or case numbers, no `ordnung.db`, backup file or data folder. Show the problem with
        the demo (`ordnung demo`, a fictional person's letters) or a letter you made up, and describe a
        real letter in your own words instead of attaching it.

        A security problem? Don't open an issue: [SECURITY.md](https://github.com/ahmedEid1/ordnung/blob/main/SECURITY.md)
        says how to report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what Ordnung did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      description: Ideally in the demo (`ordnung demo`), so anyone can follow them.
      placeholder: |
        1. ordnung demo
        2. Open …
        3. Click …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ordnung version
      description: What `ordnung --version` prints.
      placeholder: ordnung 0.2.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: What `ordnung doctor` prints
      description: It checks Claude Code, search, fonts, the web app and your data folder, and makes no model call. It shows folder paths and, with hand-off sync, your computers' names (often with your first name, like Annas-MacBook-Pro); replace any name in them before you send it.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed Ordnung
      options:
        - pipx
        - uv tool
        - pip
        - a source checkout (make install)
        - another way (say below)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Your operating system and version, and the browser if the problem is in the web app.
      placeholder: Ubuntu 24.04, Firefox 131
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Error messages or log lines (check them for personal data first), and anything that helps.
      render: text
  - type: checkboxes
    id: no-personal-data
    attributes:
      label: Personal data
      options:
        - label: Nothing above or attached shows a real letter or personal data.
          required: true
