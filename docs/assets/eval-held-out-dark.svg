<title id="held-out-dark-w-t">Held-out deadlines, read once: exact date and harm</title>
<desc id="held-out-dark-w-d">Dot plot of 168 held-out deadlines, with 95 % Clopper–Pearson intervals. LLM + rules tool: 167 of 168 exactly right (99.4 %, 95 % CI 96.7–100.0); 1 late, 0 missed, 0 early: 1 of 168 late or missed; Ordnung: 163 of 168 exactly right (97.0 %, 95 % CI 93.2–99.0); 2 late, 1 missed, 2 early: 3 of 168 late or missed; LLM + rules text: 154 of 168 exactly right (91.7 %, 95 % CI 86.4–95.4); 1 late, 0 missed, 13 early: 1 of 168 late or missed; LLM only: 136 of 168 exactly right (81.0 %, 95 % CI 74.2–86.6); 13 late, 0 missed, 19 early: 13 of 168 late or missed.</desc>
