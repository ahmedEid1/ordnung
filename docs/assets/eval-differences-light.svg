<svg xmlns="http://www.w3.org/2000/svg" width="740" height="265" viewBox="0 0 740 265" role="img" aria-labelledby="differences-light-w-t differences-light-w-d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="differences-light-w-t">Is Ordnung clearly better than each baseline?</title>
<desc id="differences-light-w-d">Forest plot of paired differences on the same held-out deadlines, Ordnung minus each baseline, in percentage points with 95 % paired letter-cluster bootstrap intervals. Ordnung minus LLM + rules tool: exact dates −2.4 [−5.4, +0.0] points, 1 vs 5 discordant, exact p 0.219; harmful dates +1.2 [−1.2, +3.6] points, 3 vs 1 discordant, exact p 0.625. Ordnung minus LLM + rules text: exact dates +5.4 [+0.6, +10.4] points, 14 vs 5 discordant, exact p 0.064; harmful dates +1.2 [−1.2, +3.6] points, 3 vs 1 discordant, exact p 0.625. Ordnung minus LLM only: exact dates +16.1 [+9.4, +23.1] points, 31 vs 4 discordant, exact p &lt; 0.001; harmful dates −6.0 [−10.8, −1.2] points, 3 vs 13 discordant, exact p 0.021.</desc>
