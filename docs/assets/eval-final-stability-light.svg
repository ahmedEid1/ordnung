<svg xmlns="http://www.w3.org/2000/svg" width="740" height="282" viewBox="0 0 740 282" role="img" aria-labelledby="final-stability-light-w-t final-stability-light-w-d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="final-stability-light-w-t">How steady each condition's dates are over the reads</title>
<desc id="final-stability-light-w-d">Dot plot of how steady the dates of 112 deadlines are over 3 reads, each rate with its 95 % interval. LLM + rules tool: right in every read 98.2 % (110/112, 95 % CI 93.7–99.8); date changed between reads 0.9 % (1/112, 95 % CI 0.0–4.9). LLM + rules text: right in every read 96.4 % (108/112, 95 % CI 91.1–99.0); date changed between reads 2.7 % (3/112, 95 % CI 0.6–7.6). Ordnung: right in every read 92.9 % (104/112, 95 % CI 86.4–96.9); date changed between reads 0.9 % (1/112, 95 % CI 0.0–4.9). LLM only: right in every read 79.5 % (89/112, 95 % CI 70.8–86.5); date changed between reads 16.1 % (18/112, 95 % CI 9.8–24.2).</desc>
