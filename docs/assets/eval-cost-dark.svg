<svg xmlns="http://www.w3.org/2000/svg" width="740" height="282" viewBox="0 0 740 282" role="img" aria-labelledby="cost-dark-w-t cost-dark-w-d" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="cost-dark-w-t">What each condition costs</title>
<desc id="cost-dark-w-d">Dot plot of the API-equivalent cost per letter and per right date over 189 held-out letters. LLM + rules tool: $0.0573 per letter, $0.0649 per right date, latency p50 25.5 s, p95 54.6 s, 99.4 % exactly right; Ordnung: $0.0845 per letter, $0.0980 per right date, latency p50 50.3 s, p95 119.4 s, 97.0 % exactly right; LLM + rules text: $0.0472 per letter, $0.0579 per right date, latency p50 29.1 s, p95 58.6 s, 91.7 % exactly right; LLM only: $0.0500 per letter, $0.0695 per right date, latency p50 32.1 s, p95 71.6 s, 81.0 % exactly right.</desc>
